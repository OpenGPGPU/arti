# Generic ARTI Linux/QEMU integration profile.
# Paths are relative to this file.
project:
  name: arti_linux_generic

rtl:
  top_module: simple_gpio
  source_files: [../../examples/simple_gpio/simple_gpio.v]
  clk_freq_mhz: 100

bridge:
  protocol: auto
  base_address: "0x0B00_0000"
  data_width: 32
  mode: qemu-embedded

display:
  enabled: false
  width: 1024
  height: 768
  format: a8r8g8b8
  framebuffer_offset: 0x100000
  framebuffer_size: 0x800000

integration:
  irq_base: 180
  dt_compat: ["arti,rtl"]
  driver_ko: ""
  driver_deps: ""
  driver_manifest: ""
  driver_marker: "ARTI EXTERNAL DRIVER PASS"
  skip_generic_test: false
  gpu_reference: false

advanced:
  timeout_cycles: 1000
