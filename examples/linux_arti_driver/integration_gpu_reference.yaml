# Reference-only GPU profile. Real GPU projects should provide their own
# compatible string, ABI, RTL and Linux driver outside ARTI.
project:
  name: arti_gpu_reference

rtl:
  top_module: arti_gpu
  source_files: [../../examples/arti_gpu/arti_gpu.v]
  clk_freq_mhz: 100

bridge:
  protocol: auto
  base_address: "0x0B00_0000"
  data_width: 32
  mode: qemu-embedded

display:
  enabled: true
  width: 1024
  height: 768
  format: a8r8g8b8
  framebuffer_offset: 0x100000
  framebuffer_size: 0x800000

integration:
  irq_base: 180
  dt_compat: ["arti,rtl-gpu", "arti,rtl"]
  driver_ko: ""
  driver_marker: "ARTI EXTERNAL DRIVER PASS"
  skip_generic_test: true
  gpu_reference: true

advanced:
  timeout_cycles: 1000
