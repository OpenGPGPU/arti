[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arti-rtl"
version = "0.1.0"
description = "Automatic RTL interface inference and co-simulation project generator"
requires-python = ">=3.10"

[project.scripts]
arti = "arti.cli:main"
arti-mcp = "arti.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
